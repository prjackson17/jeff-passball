<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MLB Daily Briefing</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1923;
      color: #e8edf2;
      min-height: 100vh;
      padding: 0 0 60px;
    }

    header {
      background: #041e42;
      border-bottom: 3px solid #bf0d3e;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 { font-size: 1.4rem; font-weight: 700; color: #fff; }
    header h1 span { color: #bf0d3e; }

    .badges { display: flex; gap: 8px; flex-wrap: wrap; }

    .badge {
      font-size: 0.72rem; font-weight: 600;
      padding: 3px 10px; border-radius: 12px;
      background: #1a2e44; color: #8ba5bf; border: 1px solid #2a4560;
      white-space: nowrap;
    }
    .badge.on   { background: #0d2e1a; color: #4caf82; border-color: #1a5c38; }
    .badge.warn { background: #2e1a0d; color: #e0a050; border-color: #5c3a1a; }

    .container { max-width: 860px; margin: 0 auto; padding: 28px 20px 0; }

    .section-title {
      font-size: 0.75rem; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: #bf0d3e; margin-bottom: 10px;
    }

    /* ── Spinning baseball ── */
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .loader {
      display: flex; align-items: center; gap: 12px;
      color: #4a6a88; font-style: italic; font-size: 0.95rem; padding: 8px 0;
    }
    .loader .ball { font-size: 1.6rem; display: inline-block; animation: spin 1s linear infinite; }

    /* ── Markdown styles ── */
    .md-body { line-height: 1.75; font-size: 0.95rem; color: #cdd8e3; }
    .md-body h1, .md-body h2, .md-body h3 { color: #e8edf2; font-weight: 700; margin: 1.1em 0 0.4em; }
    .md-body h1 { font-size: 1.15rem; border-bottom: 1px solid #1f3a55; padding-bottom: 5px; }
    .md-body h2 { font-size: 1.0rem; color: #8bbfe0; }
    .md-body h3 { font-size: 0.95rem; color: #8bbfe0; }
    .md-body p  { margin: 0.55em 0; }
    .md-body strong { color: #e8edf2; font-weight: 700; }
    .md-body em     { color: #a0bcd0; }
    .md-body ul, .md-body ol { margin: 0.5em 0 0.5em 1.4em; }
    .md-body li { margin: 0.2em 0; }
    .md-body hr { border: none; border-top: 1px solid #1f3a55; margin: 1em 0; }
    .md-body code { background: #0f1f30; color: #7dd3fc; padding: 1px 5px; border-radius: 3px; font-size: 0.88em; }

    /* ── Briefing card ── */
    #briefing-card {
      background: #152535; border: 1px solid #1f3a55;
      border-radius: 8px; padding: 22px 26px; margin-bottom: 28px;
    }
    #briefing-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
    }
    #last-updated { font-size: 0.75rem; color: #5a7a99; }

    /* ── Chat card ── */
    #chat-card {
      background: #152535; border: 1px solid #1f3a55;
      border-radius: 8px; overflow: hidden;
    }

    #chat-header { padding: 16px 22px 0; }

    #chat-messages {
      max-height: 520px;
      overflow-y: auto;
      padding: 16px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    #chat-messages:empty::after {
      content: "Ask anything about recent MLB games, standings, or player stats.";
      color: #3a5a78;
      font-style: italic;
      font-size: 0.9rem;
      text-align: center;
      margin: 20px auto;
    }

    .msg-row { display: flex; flex-direction: column; gap: 4px; }
    .msg-row.user  { align-items: flex-end; }
    .msg-row.assistant { align-items: flex-start; }

    .msg-bubble {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.93rem;
      line-height: 1.5;
    }

    .msg-row.user .msg-bubble {
      background: #bf0d3e;
      color: #fff;
      border-bottom-right-radius: 3px;
    }

    .msg-row.assistant .msg-bubble {
      background: #0f1f30;
      color: #cdd8e3;
      border-bottom-left-radius: 3px;
    }

    .msg-row.assistant .msg-bubble.md-body { padding: 12px 16px; }

    /* ── Input row ── */
    #chat-input-row {
      display: flex;
      gap: 10px;
      padding: 14px 22px 18px;
      border-top: 1px solid #1f3a55;
      background: #152535;
    }

    #question-input {
      flex: 1;
      background: #0f1f30; border: 1px solid #2a4560;
      border-radius: 20px; color: #e8edf2;
      font-size: 0.95rem; padding: 9px 16px; outline: none;
    }
    #question-input:focus { border-color: #bf0d3e; }
    #question-input::placeholder { color: #3a5a78; }

    #submit-btn {
      background: #bf0d3e; color: #fff;
      border: none; border-radius: 20px;
      font-weight: 600; font-size: 0.85rem;
      padding: 9px 20px; cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    #submit-btn:hover    { background: #d41246; }
    #submit-btn:disabled { opacity: 0.5; cursor: default; }

    .error { color: #e05a5a !important; font-style: normal !important; }
  </style>
</head>
<body>

<header>
  <h1>⚾ MLB <span>Daily Briefing</span></h1>
  <div class="badges" id="badges"><span class="badge">Loading…</span></div>
</header>

<div class="container">

  <!-- Briefing -->
  <div id="briefing-card">
    <div id="briefing-header">
      <div class="section-title">Today's Briefing</div>
      <span id="last-updated"></span>
    </div>
    <div id="briefing-text">
      <div class="loader"><span class="ball">⚾</span> Loading briefing…</div>
    </div>
  </div>

  <!-- Chat -->
  <div id="chat-card">
    <div id="chat-header">
      <div class="section-title">Ask About Recent Games</div>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-input-row">
      <input
        id="question-input"
        type="text"
        placeholder="Who led the AL East? Any walk-off wins? How is Pete Alonso doing?"
        onkeydown="if(event.key==='Enter' && !event.shiftKey) { event.preventDefault(); doQuery(); }"
      />
      <button id="submit-btn" onclick="doQuery()">Send</button>
    </div>
  </div>

</div>

<script>
  marked.setOptions({ breaks: true });

  let history = [];

  function renderMd(text) {
    const div = document.createElement('div');
    div.className = 'md-body';
    div.innerHTML = marked.parse(text || '');
    return div;
  }

  function appendMessage(role, content, isLoader) {
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    const bubble = document.createElement('div');

    if (isLoader) {
      bubble.className = 'msg-bubble loader';
      bubble.innerHTML = '<span class="ball">⚾</span> Thinking…';
    } else if (role === 'user') {
      bubble.className = 'msg-bubble';
      bubble.textContent = content;
    } else {
      bubble.className = 'msg-bubble md-body';
      bubble.innerHTML = marked.parse(content || '');
    }

    row.appendChild(bubble);
    row.dataset.role = role;

    const container = document.getElementById('chat-messages');
    container.appendChild(row);
    container.scrollTop = container.scrollHeight;
    return row;
  }

  async function loadHealth() {
    try {
      const r = await fetch('/api/health');
      const d = await r.json();
      document.getElementById('badges').innerHTML = [
        `<span class="badge ${d.embedder === 'finetuned' ? 'on' : 'warn'}">${d.embedder === 'finetuned' ? 'Fine-tuned ✓' : 'Base model'}</span>`,
        `<span class="badge ${d.classifier ? 'on' : ''}">${d.classifier ? 'Reranker ✓' : 'No reranker'}</span>`,
        `<span class="badge ${d.novelty_enabled ? 'on' : ''}">${d.novelty_enabled ? 'Novelty ✓' : 'No novelty'}</span>`,
        `<span class="badge ${d.query_store_ready ? 'on' : ''}">${d.query_store_ready ? '14-day window ✓' : 'Short window'}</span>`,
      ].join('');
    } catch {}
  }

  async function loadBriefing() {
    const el = document.getElementById('briefing-text');
    const ts = document.getElementById('last-updated');
    try {
      const r = await fetch('/api/briefing');
      const d = await r.json();
      el.innerHTML = '';
      el.appendChild(renderMd(d.briefing || '_No briefing available._'));
      if (d.last_refresh) {
        const dt = new Date(d.last_refresh + 'Z');
        ts.textContent = 'Updated ' + dt.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      }
    } catch {
      el.innerHTML = '<p class="error">Failed to load briefing. Is ANTHROPIC_API_KEY set?</p>';
    }
  }

  async function doQuery() {
    const input  = document.getElementById('question-input');
    const btn    = document.getElementById('submit-btn');
    const q = input.value.trim();
    if (!q || btn.disabled) return;

    btn.disabled = true;
    input.value = '';

    // Show user message
    appendMessage('user', q);

    // Add to history before sending
    history.push({ role: 'user', content: q });

    // Show typing indicator
    const loaderRow = appendMessage('assistant', '', true);

    try {
      const r = await fetch('/api/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q, history }),
      });
      const d = await r.json();

      loaderRow.remove();

      if (r.ok) {
        appendMessage('assistant', d.answer);
        history.push({ role: 'assistant', content: d.answer });
      } else {
        appendMessage('assistant', `**Error:** ${d.detail || 'Something went wrong.'}`);
        history.pop(); // remove failed user turn
      }
    } catch {
      loaderRow.remove();
      appendMessage('assistant', '**Error:** Request failed — server may be unavailable.');
      history.pop();
    } finally {
      btn.disabled = false;
      input.focus();
    }
  }

  loadHealth();
  loadBriefing();
</script>
</body>
</html>
